name: JadwAI checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jadwai
          POSTGRES_PASSWORD: jadwai_test
          POSTGRES_DB: jadwai
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U jadwai" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jadwai:jadwai_test@127.0.0.1:5432/jadwai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and verify backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.lock.txt
          alembic upgrade head
          python -m pytest -q
      - name: Build and verify frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
